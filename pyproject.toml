[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eso-nmpc"
version = "0.1.0"
description = "Quadrotor NMPC with an acados runtime disturbance interface"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
acados = ["casadi>=3.7.2,<3.8"]
validation = ["scipy>=1.13"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["nmpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires a configured native acados toolchain"]
