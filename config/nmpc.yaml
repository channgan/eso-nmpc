model:
  # Gazebo x500_base: 2.0 kg body + four 0.016076923 kg rotors.
  mass: 2.0643076923         # kg
  gravity: 9.80665           # m/s^2, positive down in NED
  # First-order lag modelling PX4's rate loop.  In SITL the command-to-
  # actuation delay measures ~0.20-0.21 s (delay-aligned rate-tracking
  # analysis of the recorded flights).  Without a lag state the OCP commands
  # corrections faster than the vehicle can execute them (sustained
  # +/-0.8 rad/s limit cycle); with it the solver keeps its plan inside the
  # achievable rate response while still using full rate authority.
  # 0.15 s (about two thirds of the measured delay) rather than the full
  # 0.21 s: the horizon lead covers the remaining transport delay.  Real
  # SITL point_1m comparison: tau 0.10 raises saturation to 27.6% (rmse
  # 0.156) vs 18.4% (rmse 0.133) at tau 0.15 -- with the faster model the
  # OCP plans snappier feedback corrections and bangs the envelope harder,
  # which the offline replay (predicted 6.4% at tau 0.10) does not capture.
  rate_tau: 0.15             # s

controller:
  sample_time: 0.02          # s, NMPC prediction/reference discretization
  control_period: 0.02       # s, nominal elapsed-step/heartbeat base; output is odometry-event driven
  horizon_steps: 30
  reference_timeout: 0.20    # s, maximum accepted PX4 trajectory/interface age
  qp_solver_cond_N: 5
  nlp_solver_type: SQP_RTI
  integrator_type: ERK
  levenberg_marquardt: 1.0e-4
  # Shift the previous optimal state, control, and dynamics-multiplier
  # trajectories forward by one stage. Failed solves automatically fall back
  # to the current reference trajectory and zero multipliers.
  warm_start: true        # use warm start; reset conditionally on timing/reference faults

# Each residual is divided by its engineering scale before it is squared.
# Therefore every term below is dimensionless and has the same unit cost when
# its error reaches the configured scale.  There is no additional priority
# multiplier: internally Q/R are generated only as 1 / scale^2.
cost_scales:
  # Uniformly multiply every Q/R term; 0.7 means all weights are 30% lower
  # while preserving the relative weighting and the engineering scales below.
  weight_factor: 0.7
  # Vertical position error is weighted twice as strongly as horizontal error.
  position_error_m: [0.1, 0.1, 0.0707106781]
  velocity_error_m_s: [0.1, 0.1, 0.1]
  # SO(3) logarithmic attitude error [roll, pitch, yaw].
  attitude_error_deg: [5.0, 5.0, 5.0]
  # Control residuals are NMPC output minus inverse-dynamics feed-forward,
  # not absolute thrust/body rate and not measured inner-loop tracking error.
  thrust_correction_n: 0.418330013
  body_rate_correction_deg_s: [5.0, 5.0, 5.0]

limits:
  # Matched to the calibrated direct rate-setpoint throttle range below.
  thrust_min: 3.3278         # N
  thrust_max: 27.7314        # N
  # Rate envelope.  0.8 rad/s was the conservative envelope inherited from
  # the reference open-source project; SITL shows the 1 m step demand
  # (feedforward 0.4 rad/s + feedback correction + lag lead) pins the command
  # at the limit on 18% of metric solves.  Raising to 1.0 lets the OCP use
  # the authority it actually asks for (~0.9-1.0 rad/s) without changing the
  # maneuver.  Keep the delay-limit-cycle margin in mind before raising
  # further: the value exists to stay inside the modelled rate bandwidth.
  body_rate_max: [1.0, 1.0, 1.0]  # rad/s
  # Keep the NMPC flight envelope aligned with the corresponding PX4 MPC
  # parameters. Velocity is expressed in NED, while PX4 stores tilt in degrees.
  # Deployment horizontal flight-speed ceiling, shared with PX4 position modes.
  horizontal_speed_max: 2.0        # m/s
  vertical_speed_max_up: 3.0       # m/s, MPC_Z_VEL_MAX_UP (-vz in NED)
  vertical_speed_max_down: 1.5     # m/s, MPC_Z_VEL_MAX_DN (+vz in NED)
  horizontal_acceleration_max: 2.0 # m/s^2, MPC_ACC_HOR(_MAX)
  vertical_acceleration_max_up: 4.0   # m/s^2, MPC_ACC_UP_MAX
  vertical_acceleration_max_down: 3.0 # m/s^2, MPC_ACC_DOWN_MAX
  jerk_max: 4.0                    # m/s^3, MPC_JERK_AUTO/MAX
  # Allowed mismatch between supplied jerk and the acceleration-node slope.
  # Covers float32 transport and discrete sampling without accepting a fake
  # zero-jerk trajectory whose acceleration is visibly changing.
  jerk_consistency_tolerance: 0.5  # m/s^3
  tilt_max_deg: 45.0               # deg, MPC_TILTMAX_AIR

px4:
  # Measured in gz_x500 while publishing VehicleRatesSetpoint directly.
  # This is intentionally different from the position-controller MPC_THR_HOVER.
  hover_throttle: 0.73
  throttle_min: 0.12
  throttle_max: 1.00

manual_control:
  # ManualControlSetpoint stick deadzone and loss timeout.
  deadzone: 0.08
  timeout: 0.50                    # s
  # Sticks command velocity in the current yaw-heading frame.
  max_horizontal_speed: 2.0       # m/s, shared PX4/NMPC deployment ceiling
  max_vertical_speed: 0.5         # m/s; positive throttle moves up
  max_yaw_rate: 0.5               # rad/s
  max_horizontal_acceleration: 2.0  # m/s^2, matches MPC_ACC_HOR(_MAX)
  max_vertical_acceleration: 0.6    # m/s^2
  max_yaw_acceleration: 1.0         # rad/s^2
  # Prevent a sustained command from winding the reference far ahead of the vehicle.
  max_horizontal_position_lead: 0.8  # m
  max_vertical_position_lead: 0.4    # m

eso:
  # Velocity-channel LESO. It estimates world/NED acceleration disturbance;
  # the estimate is used consistently by inverse-dynamics feed-forward and
  # the NMPC prediction model.
  enabled: true
  bandwidth_rad_s: 3.0              # selected baseline for noisy hover/small-wind tests
  disturbance_clamp_m_s2: 1.0       # world-frame estimate limit
  activation_delay_s: 3.0           # allow takeoff/odometry to settle
  innovation_limit_m_s: 0.5         # protects against stale/jump samples

code_generation:
  model_name: quadrotor_nmpc
  # Current acados requires a basename; it writes this inside code_export_directory.
  json_file: quadrotor_nmpc.json
  code_export_directory: generated/quadrotor_nmpc
